name: refresh

# Automatic pipeline refresh (preferred over `--watch`, which needs a long-running
# process). Each run is a single CronTrigger: fetch live -> reconcile -> simulate
# -> figures + probabilities JSON, published as artifacts (outputs are regenerable
# and not version-controlled: see .gitignore).

on:
  workflow_dispatch: {}
  schedule:
    # Every 30 min. Only makes sense during the tournament (Jun-Jul 2026); outside
    # that window, disable the workflow or space the cron out to save API budget.
    # The provider only supports polling, not push; tighten the cron on match days
    # (or switch to the provider's webhook for instant refresh if they add one).
    - cron: "*/30 * * * *"

# Don't overlap runs: if one is still going when the next triggers, it waits.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Run pipeline (live)
        # Primary provider is football-data.org (config.data.live.provider). Set the
        # FOOTBALL_DATA_TOKEN secret in the repo's Settings > Secrets.
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/run_pipeline.py --mode live
      - name: Upload predictions
        uses: actions/upload-artifact@v4
        with:
          name: predictions-${{ github.run_id }}
          path: |
            data/processed/probabilities_*.json
            data/processed/latest.json
            outputs/figures/*.png
            outputs/videos/*.mp4
          if-no-files-found: warn
