[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldcup2026-predictor"
version = "0.1.0"
description = "Live-updating FIFA World Cup 2026 predictor (Elo -> Dixon-Coles -> conditional Monte Carlo)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",          # parquet snapshots
    "scipy>=1.11",          # Poisson / Dixon-Coles optimization
    "scikit-learn>=1.3",    # calibration: Brier, log-loss, Platt/isotonic
    "pydantic>=2.5",        # config validation
    "pyyaml>=6.0",          # config.yaml
    "typer>=0.9",           # CLI
    "requests>=2.31",       # live-results HTTP clients
    "matplotlib>=3.8",      # static viz / MP4 export
    "plotly>=5.18",         # interactive viz
    "streamlit>=1.30",      # dashboard
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1.9",
    "black>=23.12",
    "mypy>=1.8",
    "types-requests",
    "types-PyYAML",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/F = pycodestyle/pyflakes, I = isort, UP = pyupgrade, B = bugbear, SIM = simplify
select = ["E", "F", "I", "UP", "B", "SIM"]
# Reglas que dejamos sin migrar a propósito:
#   UP017 -> preferimos `timezone.utc` explícito sobre `datetime.UTC`.
#   UP042 -> `str, Enum` por compatibilidad/seguridad con pydantic (no `StrEnum`).
ignore = ["UP017", "UP042"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true   # libs sin stubs de tipos (p.ej. streamlit)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # permite importar `worldcup` sin instalar el paquete
