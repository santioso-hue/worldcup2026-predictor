# =============================================================================
# config.yaml — single source of hyperparameters, paths, seed, and mode.
# No magic numbers live in the model code: everything goes here.
# Values marked [ref:Hicruben] are reasonable defaults taken from the primary
# reference and VERIFIED against its repo; they're tunable, not fixed
# constants.
# =============================================================================

project:
  name: worldcup2026-predictor
  seed: 42                 # global seed -> worldcup.rng.get_rng(seed)
  mode: live               # live (DEFAULT) | pre_tournament

paths:
  data_raw: data/raw               # IMMUTABLE (snapshots)
  data_processed: data/processed   # ready-to-use features
  figures: outputs/figures
  videos: outputs/videos

# ---------------------------------------------------------------------------
# Data. All live sources go through LiveResultsProvider.
# Schemas VERIFIED on Jun 16 2026.
# ---------------------------------------------------------------------------
data:
  historical:               # Elo base + backtest
    source: martj42/international_results
    results_url: https://raw.githubusercontent.com/martj42/international_results/master/results.csv
    shootouts_url: https://raw.githubusercontent.com/martj42/international_results/master/shootouts.csv
  schedule:                 # 2026 fixture backbone
    source: openfootball/worldcup.json
    url: https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json
  live:                     # football-data.org v4: free, covers WC2026, no season limit
    provider: football_data
    base_url: https://api.football-data.org/v4
    competition_code: WC             # competition code (World Cup)
    token_env: FOOTBALL_DATA_TOKEN   # token lives in .env, NEVER in this file
    poll_interval_seconds: 900       # 15 min between polls (free tier: 10 req/min)
  snapshots:
    dir: data/raw
    filename_pattern: "results_{ts}.parquet"   # ts = YYYYMMDDtHHMM
    latest_pointer: latest.txt                 # points to the most recent snapshot

# ---------------------------------------------------------------------------
# Dynamic Elo (features/elo.py). The k factor weights by match importance
# and goal margin.
# ---------------------------------------------------------------------------
elo:
  initial_rating: 1500.0          # base rating for teams with no history
  home_advantage: 75.0            # home Elo bonus                [ref:Hicruben]
  host_advantage: 37.5            # host bonus (World Cup)        [ref:Hicruben]
  recency_half_life_months: 48.0  # half-life of the time weight (form vs. reputation).
                                  # HEADS UP: the full-history backtest prefers much
                                  # longer half-lifes (240m+) for lower per-match
                                  # log-loss, but that over-concentrates champion odds
                                  # (Argentina ~30%, unrealistic). 48m is chosen for
                                  # tournament realism over per-match log-loss.
  base_lambda: 1.35               # expected goals at Elo diff 0  [ref:Hicruben]
  elo_per_goal_denominator: 300.0 # +1 expected goal per 300 Elo (tuned via backtest:
                                  # 300 gives sharper predictions than the 400 default)
  lambda_min: 0.3                 # lower clip on expected goals  [ref:Hicruben]
  lambda_max: 3.5                 # upper clip on expected goals  [ref:Hicruben]
  k_factors:                      # importance weight (tuned via backtest: x1.2 over
                                  # Hicruben defaults; minimizes out-of-sample
                                  # log-loss 2023+)
    world_cup: 66.0
    continental: 60.0             # Euro, Copa América, etc.
    world_cup_qualifier: 48.0
    nations_league: 38.4
    default: 33.6
    friendly: 21.6
  goal_margin:                    # margin multiplier (eloratings.net)
    two_goal: 1.5                 # |d| == 2
    offset: 11.0                  # |d| >= 3 -> (offset + |d|) / divisor
    divisor: 8.0

# ---------------------------------------------------------------------------
# Dixon-Coles (models/dixon_coles.py): low-score correction.
# ---------------------------------------------------------------------------
dixon_coles:
  rho: -0.13      # low-score dependence (0-0,1-0,0-1,1-1)  [ref:Hicruben]
  max_goals: 8    # cap on the scoreline matrix

# ---------------------------------------------------------------------------
# Conditional Monte Carlo (simulation/tournament.py).
# ---------------------------------------------------------------------------
simulation:
  runs: 50000                 # number of simulated tournaments
  extra_time_total_goals: 0.8 # total expected goals in extra time [ref:Currybon30]
  hosts:                      # WC2026 hosts: get +elo.host_advantage in their matches
    - United States
    - Mexico
    - Canada

# ---------------------------------------------------------------------------
# Evaluation (evaluation/backtest.py + calibration.py).
# ---------------------------------------------------------------------------
evaluation:
  burn_in_matches: 150       # warm-up matches before evaluation starts [ref:Hicruben]
  history_window_days: 36500 # backtest refit window. Must be >> recency_half_life:
                              # with a 48m half-life, 8 years (the previous value)
                              # truncated ~25% of the weight at the edge and
                              # underrated the top teams. 36500 days (~100y) is
                              # effectively full-history -> the backtest evaluates the
                              # SAME Elo as production. [backtest<->prod kept in sync]
